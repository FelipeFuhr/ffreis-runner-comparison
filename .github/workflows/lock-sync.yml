name: Lock Sync

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [ main ]
    paths:
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/lock-sync.yml"
  push:
    branches: [ main ]
    paths:
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/lock-sync.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lock-sync:
    permissions:
      contents: read
    uses: FelipeFuhr/ffreis-workflows-python/.github/workflows/python-lock-sync.yml@359eb22d0d22b6266b4543764f1c8bebe5e84765 # v1.3.0
    with:
      python-version: "3.11"
