name: DevOps / Grype FS

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main, master]


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  grype-fs:
    permissions:
      contents: read
      actions: read
      security-events: write
    uses: FelipeFuhr/ffreis-workflows-general/.github/workflows/general-scan-grype-fs.yml@82097e621b8f630f2be2f759025529f7f5442796 # v1.9.0
    with:
      # scan-fix(ci:invalid-input): renamed scan-ref -> path — general-scan-grype-fs.yml
      # has never had a `scan-ref` input (confirmed back to v1.5.0, the previously
      # pinned version); GitHub rejects unknown workflow_call inputs at call-graph
      # validation time, before any job starts.
      path: .
      upload-sarif: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false }}
