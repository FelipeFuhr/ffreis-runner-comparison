name: Mutation Testing (mutmut)

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
    paths:
      - "orchestrator/**"
      - "workloads/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/mutation.yml"
  push:
    branches: [main]
    paths:
      - "orchestrator/**"
      - "workloads/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/mutation.yml"
  schedule:
    - cron: "25 2 22 * *"  # monthly scattered (was: 0 2 * * 0)

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mutation:
    if: ${{ github.event_name != 'pull_request' }}
    permissions:
      contents: read
    uses: FelipeFuhr/ffreis-workflows-python/.github/workflows/python-mutation.yml@6c507728c6d3dc346cbeb1fe19df72de018bd5b4 # v1.7.0
    with:
      runner: '["ubuntu-latest"]'
      python-version: "3.11"
      uv-extras: "dev"
      paths-to-mutate: "orchestrator workloads"
      threshold: 80

  mutation-incremental:
    if: ${{ github.event_name == 'pull_request' }}
    permissions:
      contents: read
    uses: FelipeFuhr/ffreis-workflows-python/.github/workflows/python-mutation.yml@6c507728c6d3dc346cbeb1fe19df72de018bd5b4 # v1.7.0
    with:
      in-diff: true
      runner: '["ubuntu-latest"]'
      python-version: "3.11"
      uv-extras: "dev"
      paths-to-mutate: "orchestrator workloads"
      threshold: 80

