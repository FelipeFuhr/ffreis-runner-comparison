[project]
name = "ffreis-onnx-runner-comparison"
version = "0.2.0"
description = "Parity and performance harness for Python vs Rust ONNX serving"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27.0",
  "hypothesis>=6.0.0",
  "locust>=2.32.0",
  "pyyaml>=6.0.0",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11.0",
  # mutmut v3 dropped --paths-to-mutate/--tests-dir, which `make mutation-test`
  # and mutation.yml's inline `mutmut run` step still invoke. Pin <3 until
  # those migrate to v3-native [tool.mutmut] config.
  "mutmut>=2.4,<3",
  "pre-commit>=3.7.0",
  "pytest>=8.3.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.6.0",
  "types-PyYAML>=6.0.12.20240917",
]

[project.scripts]
onnx-runner-compare = "orchestrator.main:main"

# scan-fix(ci:setuptools-flat-layout): the repo root also holds config/,
# scenarios/, artifacts/ (data, not packages — no __init__.py). setuptools'
# flat-layout auto-discovery can't tell those apart from orchestrator/ and
# workloads/ (the only real importable packages) and refuses to build with
# "Multiple top-level packages discovered in a flat-layout". `uv build`
# (new Build All CI job) surfaced this; scope discovery explicitly.
[tool.setuptools.packages.find]
include = ["orchestrator*", "workloads*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers -ra"
markers = [
  "slow: long-running tests (mutation, full scenario runs)",
  "integration: integration tests requiring external services",
  "property: hypothesis property-based tests",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "venv", "__pycache__", "artifacts"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
disable_error_code = ["arg-type"]
exclude = "(^\\.venv/|^artifacts/)"
files = ["orchestrator", "tests", "workloads"]

[tool.coverage.run]
branch = true
source = ["orchestrator", "workloads"]

[tool.coverage.report]
show_missing = true
skip_covered = true
# Was 65% (below the fleet-wide 75% floor) with orchestrator/main.py's
# perf/parity check orchestration and both workloads/grpc + workloads/locust
# entirely untested. New tests brought real coverage to ~99.6%; 90% locks in
# that gain with slack for legitimate future untested edge cases.
fail_under = 90
exclude_also = [
  "if __name__ == .__main__.:",
]
